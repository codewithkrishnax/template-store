<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YT Thumbnails</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f4f4f8;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.08);
  --text: #18181b;
  --sub: #71717a;
  --muted: #a1a1aa;
  --red: #ff0000;
  --red-soft: rgba(255,0,0,0.07);
  --green: #16a34a;
  --blue: #2563eb;
  --sans: 'Plus Jakarta Sans', sans-serif;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 2px 10px rgba(0,0,0,0.05);
}

html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); -webkit-font-smoothing: antialiased; color: var(--text); }

.app {
  display: flex; flex-direction: column;
  height: 100dvh;
  max-width: 430px; margin: 0 auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  gap: 12px;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; padding: 4px 0 2px;
}
.header-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--red); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-icon svg { width: 18px; height: 18px; fill: #fff; }
.header-text h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header-text p { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }

/* ── Card ── */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

/* ── Input area ── */
.input-wrap { display: flex; align-items: center; gap: 0; }
.url-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: var(--sans); font-size: 14px; color: var(--text);
  padding: 15px 0 15px 15px; caret-color: var(--red);
}
.url-input::placeholder { color: var(--muted); font-size: 13.5px; }
.clear-btn {
  width: 36px; height: 36px; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted); flex-shrink: 0; margin-right: 6px;
  border-radius: 8px; transition: background 0.15s;
}
.clear-btn:active { background: var(--bg); }
.clear-btn svg { width: 16px; height: 16px; }

.input-divider { height: 1px; background: var(--border); margin: 0 15px; }

.paste-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; }
.paste-btn {
  display: flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 10px; border: none; border-radius: 7px;
  background: var(--bg); font-family: var(--sans); font-size: 12px;
  font-weight: 600; color: var(--sub); cursor: pointer; transition: opacity 0.15s;
}
.paste-btn:active { opacity: 0.5; }
.url-hint { font-size: 11.5px; color: var(--muted); font-weight: 500; }

/* ── Grab Button ── */
.grab-btn {
  width: 100%; padding: 14.5px; border: none; border-radius: var(--radius);
  background: var(--red); color: #fff;
  font-family: var(--sans); font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: -0.2px; flex-shrink: 0;
  box-shadow: 0 3px 14px rgba(255,0,0,0.25);
  transition: opacity 0.15s, transform 0.12s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.grab-btn:active { opacity: 0.85; transform: scale(0.985); }
.grab-btn svg { width: 16px; height: 16px; fill: #fff; }

/* ── State messages ── */
.state-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 24px;
}
.state-icon { width: 52px; height: 52px; background: var(--bg); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.state-icon svg { width: 26px; height: 26px; }
.state-title { font-size: 15px; font-weight: 600; color: var(--text); text-align: center; letter-spacing: -0.2px; }
.state-sub { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }

/* ── Error ── */
.error-box {
  display: none; align-items: flex-start; gap: 9px;
  background: rgba(255,0,0,0.06); border-radius: 12px; padding: 11px 13px; flex-shrink: 0;
}
.error-box.show { display: flex; }
.err-icon { width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.err-msg { font-size: 13px; font-weight: 500; color: var(--red); line-height: 1.5; }

/* ── Results ── */
.results { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 10px; }
.results::-webkit-scrollbar { display: none; }

/* Video info strip */
.video-info {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); flex-shrink: 0;
}
.yt-badge { width: 28px; height: 28px; background: var(--red-soft); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.yt-badge svg { width: 15px; height: 15px; fill: var(--red); }
.video-id-text { font-size: 13px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; letter-spacing: -0.3px; }
.video-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* Thumbnail card */
.thumb-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; flex-shrink: 0; }
.thumb-header { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px 9px; }
.quality-badge { font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: -0.1px; }
.quality-dim { font-size: 11px; color: var(--muted); margin-top: 1px; }
.dl-btn {
  display: flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 12px; border: none; border-radius: 8px;
  background: var(--bg); font-family: var(--sans); font-size: 12px;
  font-weight: 600; color: var(--blue); cursor: pointer; transition: opacity 0.15s;
  text-decoration: none;
}
.dl-btn:active { opacity: 0.5; }
.dl-btn svg { width: 13px; height: 13px; stroke: var(--blue); }

.thumb-img-wrap { position: relative; background: #000; }
.thumb-img { width: 100%; display: block; object-fit: cover; aspect-ratio: 16/9; }
.thumb-img.loading { opacity: 0; }
.thumb-img.loaded { opacity: 1; transition: opacity 0.25s; }
.thumb-img.failed { display: none; }
.thumb-unavail { display: none; padding: 28px 16px; text-align: center; font-size: 13px; color: var(--muted); }
.thumb-unavail.show { display: block; }

/* Loader */
.loader { display: none; flex-shrink: 0; }
.loader.show { display: block; }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.shimmer { background: linear-gradient(90deg, #f0f0f4 25%, #e8e8ee 50%, #f0f0f4 75%); background-size: 400px 100%; animation: shimmer 1.2s infinite; }
.shimmer-box { width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); }
.shimmer-line { height: 14px; border-radius: 6px; margin-bottom: 8px; }
.shimmer-line.w60 { width: 60%; }
.shimmer-line.w40 { width: 40%; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 00.5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.75 15.5V8.5l6.25 3.5-6.25 3.5z"/></svg>
    </div>
    <div class="header-text">
      <h1>YT Thumbnails</h1>
      <p>Grab any quality instantly</p>
    </div>
  </div>

  <!-- Input Card -->
  <div class="card" style="flex-shrink:0">
    <div class="input-wrap">
      <input class="url-input" id="urlInput" type="url" inputmode="url"
        placeholder="Paste YouTube URL…" oninput="onInput()" onkeydown="onKey(event)" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" onclick="clearInput()" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="input-divider"></div>
    <div class="paste-row">
      <button class="paste-btn" onclick="pasteURL()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M8 4H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2"/></svg>
        Paste URL
      </button>
      <span class="url-hint">youtube.com or youtu.be</span>
    </div>
  </div>

  <!-- Grab Button -->
  <button class="grab-btn" onclick="grabThumbnails()">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    Grab Thumbnails
  </button>

  <!-- Error -->
  <div class="error-box" id="errorBox">
    <div class="err-icon">!</div>
    <div class="err-msg" id="errMsg"></div>
  </div>

  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="shimmer shimmer-box" style="border-radius:var(--radius);margin-bottom:10px"></div>
  </div>

  <!-- Empty State -->
  <div class="state-empty" id="emptyState">
    <div class="state-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="#a1a1aa" stroke="none"/></svg>
    </div>
    <div class="state-title">Paste a YouTube link</div>
    <div class="state-sub">All thumbnail qualities will<br>appear here instantly</div>
  </div>

  <!-- Results -->
  <div class="results" id="results" style="display:none"></div>

</div>

<script>
const QUALITIES = [
  { key: 'maxresdefault', label: 'Max Resolution', dim: '1280 × 720' },
  { key: 'sddefault',     label: 'SD',             dim: '640 × 480' },
  { key: 'hqdefault',     label: 'High Quality',   dim: '480 × 360' },
  { key: 'mqdefault',     label: 'Medium Quality', dim: '320 × 180' },
  { key: 'default',       label: 'Default',        dim: '120 × 90' },
];

function extractVideoId(url) {
  url = url.trim();
  const patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([a-zA-Z0-9_-]{11})/,
    /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function thumbURL(id, quality) {
  return `https://img.youtube.com/vi/${id}/${quality}.jpg`;
}

function onInput() {
  const v = document.getElementById('urlInput').value;
  document.getElementById('clearBtn').style.display = v ? 'flex' : 'none';
  document.getElementById('errorBox').classList.remove('show');
}

function onKey(e) { if (e.key === 'Enter') grabThumbnails(); }

function clearInput() {
  document.getElementById('urlInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('errorBox').classList.remove('show');
  showEmpty();
}

async function pasteURL() {
  try {
    const t = await navigator.clipboard.readText();
    document.getElementById('urlInput').value = t;
    onInput();
    if (extractVideoId(t)) grabThumbnails();
  } catch { document.getElementById('urlInput').focus(); }
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loader').classList.remove('show');
}

function showError(msg) {
  document.getElementById('errMsg').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}

function grabThumbnails() {
  const url = document.getElementById('urlInput').value.trim();
  document.getElementById('errorBox').classList.remove('show');

  if (!url) { showError('Please enter a YouTube URL first.'); return; }

  const videoId = extractVideoId(url);
  if (!videoId) { showError('Could not find a valid YouTube video ID. Check the URL.'); return; }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loader').classList.add('show');

  setTimeout(() => renderResults(videoId), 300);
}

function renderResults(videoId) {
  document.getElementById('loader').classList.remove('show');

  const container = document.getElementById('results');
  container.innerHTML = '';

  // Video info strip
  const info = document.createElement('div');
  info.className = 'video-info';
  info.innerHTML = `
    <div class="yt-badge">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 00.5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.75 15.5V8.5l6.25 3.5-6.25 3.5z"/></svg>
    </div>
    <div>
      <div class="video-id-text">${videoId}</div>
      <div class="video-sub">${QUALITIES.length} qualities found</div>
    </div>`;
  container.appendChild(info);

  // Thumbnail cards
  QUALITIES.forEach(q => {
    const url = thumbURL(videoId, q.key);

    const card = document.createElement('div');
    card.className = 'thumb-card';

    card.innerHTML = `
      <div class="thumb-header">
        <div>
          <div class="quality-badge">${q.label}</div>
          <div class="quality-dim">${q.dim}</div>
        </div>
        <a class="dl-btn" href="${url}" download="thumbnail-${videoId}-${q.key}.jpg" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save
        </a>
      </div>
      <div class="thumb-img-wrap">
        <img class="thumb-img loading" src="${url}" alt="${q.label} thumbnail"
          onload="this.classList.remove('loading');this.classList.add('loaded');this.nextElementSibling.classList.remove('show')"
          onerror="this.classList.add('failed');this.nextElementSibling.classList.add('show')">
        <div class="thumb-unavail">Not available for this video</div>
      </div>`;

    container.appendChild(card);
  });

  container.style.display = 'flex';
  container.scrollTop = 0;
}
</script>
</body>
</html>
